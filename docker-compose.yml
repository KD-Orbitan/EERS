services:
  postgres:
    image: postgres:16-alpine
    container_name: eers_postgres
    environment:
      POSTGRES_USER: eers
      POSTGRES_PASSWORD: eers_password
      POSTGRES_DB: eers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eers_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: