name: eers-portfolio
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eers
      POSTGRES_PASSWORD: portfolio_local_only
      POSTGRES_DB: eers_portfolio
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - portfolio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eers -d eers_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  portfolio_postgres:
